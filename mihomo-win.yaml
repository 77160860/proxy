proxy-providers:
  🌈:
    url: "订阅链接"
    type: http

mode: rule
ipv6: true
allow-lan: true
mixed-port: 7890
log-level: error
bind-address: "*"
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 300
keep-alive-interval: 75

external-ui: ui
external-ui-name: zashboard
external-controller: 127.0.0.1:9090
external-ui-url: "https://gh-proxy.org/github.com/Zephyruso/zashboard/releases/download/v3.21.0/dist-no-fonts.zip"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:  
  enable: true  
  sniff:  
    HTTP:  
      ports: [80, 8080-8880]  
    TLS:  
      ports: [443, 8443]  
    QUIC:  
      ports: [443, 8443] 
      
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  strict-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: fc00::/18
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - 'rule-set:private'
    - 'rule-set:me'
    - 'rule-set:apple'
    - 'rule-set:micro'
    - 'rule-set:cn'
  nameserver-policy:
    'rule-set:private': system
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
proxy-groups:
  - name: Proxy
    type: select
    include-all: true
    proxies: [Urltest, Balance]
    icon: https://gh-proxy.org/github.com/Orz-3/mini/raw/master/Color/SSID.png

  - name: Urltest
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    icon: https://gh-proxy.org/github.com/Orz-3/mini/raw/master/Color/Urltest.png

  - name: Balance
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: sticky-sessions
    include-all: true
    icon: https://gh-proxy.org/github.com/Orz-3/mini/raw/master/Color/Roundrobin.png

  - name: Final
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://gh-proxy.org/github.com/Orz-3/mini/raw/master/Color/Available.png
  
  - name: GLOBAL
    type: select
    include-all: true
    proxies: [Proxy, Urltest]
    icon: https://gh-proxy.org/github.com/Orz-3/mini/raw/master/Color/Skicat.png

rules:
  - DST-PORT,853,REJECT
  - RULE-SET,pvip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - RULE-SET,adblock,REJECT
  - RULE-SET,me,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,micro,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cn,DIRECT
  - RULE-SET,tgip,Proxy
  - RULE-SET,cnip,DIRECT
  - MATCH,Final

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
  me:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/me.mrs"
  cn:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/cn.mrs"
  cnip:
    <<: *ip
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/cnip.mrs"
  pvip:
    <<: *ip
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/pvip.mrs"
  tgip:
    <<: *ip
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/tgip.mrs"
  micro:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/micro.mrs"
  proxy:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/proxy.mrs"
  apple:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/apple.mrs"
  private:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/private.mrs"
  adblock:
    <<: *domain
    url: "https://gh-proxy.org/github.com/77160860/rule/raw/main/mihomo/adblock.mrs"
